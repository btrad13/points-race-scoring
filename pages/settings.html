<!doctype html>
<html lang="en" class="settings-page" data-settings-key="race-segment-scores-settings-v1">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Race Segment Scores Settings</title><link rel="icon" href="data:,">
    <link rel="stylesheet" href="/pages/css/common.css"><link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.mjs"></script>
</head>
<body>
    <div id="titlebar"><header><div class="title">Race Segment Scores Settings</div><div class="filler"></div><div class="buttons"><div title="Close this window" class="button close electron-only">×</div></div></header></div>
    <main><form id="options">
        <section>
            <h1>Scoring categories</h1>
            <p>Choose the point categories to include in the leaderboard total. All four options match ZRL points-race scoring.</p>
            <label class="check"><input type="checkbox" name="scoreFts"><span>FTS — fastest through segment</span></label>
            <label class="check"><input type="checkbox" name="scoreFal"><span>FAL — first across the line</span></label>
            <label class="check"><input type="checkbox" name="scoreFin"><span>FIN — finish-line points</span></label>
            <label class="check"><input type="checkbox" name="scorePbp"><span>PBP — podium bonus points</span></label>
        </section>
        <section>
            <h1>Leaderboard display</h1>
            <p>Show each rider separately, or combine points for riders with the same team name.</p>
            <label class="select"><span>Display scores by</span><select name="leaderboardView"><option value="riders">Individual riders</option><option value="teams">Teams</option></select></label>
        </section>
    </form></main>
</body>
</html>
